syntax = "proto3";
package racing;

option go_package = "/racing";

import "google/protobuf/timestamp.proto";
import "google/api/annotations.proto";

service Racing {
  // ListRaces returns a list of all races.
  rpc ListRaces(ListRacesRequest) returns (ListRacesResponse) {
    option (google.api.http) = { post: "/v1/list-races", body: "*" };
  }
}

/* Requests/Responses */

// Request for ListRaces call.
message ListRacesRequest {
  ListRacesRequestFilter filter = 1;
  // OrderBy sorts the results, e.g. "advertised_start_time desc, name".
  // Defaults to advertised_start_time ascending.
  string order_by = 2;
}

// Response to ListRaces call.
message ListRacesResponse {
  repeated Race races = 1;
}

// Filter for listing races.
message ListRacesRequestFilter {
  // MeetingIDs restricts the results to races in any of the given meetings.
  repeated int64 meeting_ids = 1;
  // Visible restricts the results to races whose visibility matches this
  // value. When it is unset, races are returned regardless of visibility.
  optional bool visible = 2;
}

/* Resources */

// A race resource.
message Race {
  // ID represents a unique identifier for the race.
  int64 id = 1;
  // MeetingID represents a unique identifier for the races meeting.
  int64 meeting_id = 2;
  // Name is the official name given to the race.
  string name = 3;
  // Number represents the number of the race.
  int64 number = 4;
  // Visible represents whether or not the race is visible.
  bool visible = 5;
  // AdvertisedStartTime is the time the race is advertised to run.
  google.protobuf.Timestamp advertised_start_time = 6;
  // Status is derived from advertised_start_time each time the race is read:
  // CLOSED once the advertised start time has been reached, OPEN before then.
  // It is not stored.
  Status status = 7;

  // Status says whether a race is still open, i.e. has not started yet.
  enum Status {
    // STATUS_UNSPECIFIED is the proto3 zero value. The service never sets it.
    STATUS_UNSPECIFIED = 0;
    // OPEN races have an advertised start time in the future.
    OPEN = 1;
    // CLOSED races have an advertised start time that is now or in the past.
    CLOSED = 2;
  }
}
